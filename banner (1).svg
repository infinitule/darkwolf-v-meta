  <!-- status pills -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
    <g>
      <rect x="414" y="392" width="122" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#34D399" stroke-opacity="0.5"/>
      <circle cx="432" cy="406" r="4" fill="#34D399"/>
      <text x="446" y="410" fill="#CFE9DE">RESOLVED</text>
    </g>
    <g>
      <rect x="552" y="392" width="152" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="628" y="410" text-anchor="middle" fill="#C7D0DA">WRITTEN APOLOGY</text>
    </g>
    <g>
      <rect x="720" y="392" width="150" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.15"/>
      <text x="795" y="410" text-anchor="middle" fill="#C7D0DA">3 JURISDICTIONS</text>
    </g>
  </g>
</svg>
